function seedPreview(){
 stock=[];
 const templateLocation='ER_Pedia Exam';
 for(const c of carts)for(const m of meds){
  const source=historical.find(x=>x.location===(c.legacy||templateLocation)&&x.code===m.code);
  const copied=!c.legacy;
  stock.push({cart_id:c.id,medication_code:m.code,
   actual_qty:source?(source.expiry?Number(source.qty):0):m.required,
   expiry_date:source?.expiry||null,verified_at:null,
   template_only:copied,source_note:copied?'ER reference template · not verified':'ER historical record · not reverified'});
 }
}
seedPreview();
const byCode=code=>meds.find(m=>m.code===code);
const byCart=id=>carts.find(c=>c.id===id);
const rowsFor=id=>stock.filter(s=>s.cart_id===id);
const daysRemaining=dt=>dt?Math.ceil((new Date(dt+'T23:59:59')-new Date())/86400000):null;
function status(s,m){
 if(s.actual_qty===null||s.actual_qty===undefined)return 'pending';
 const dt=s.expiry_date?.includes('/')?convertMonth(s.expiry_date):s.expiry_date;
 if(Number(s.actual_qty)<m.required)return 'low';
 if(!dt)return 'pending';
 const n=daysRemaining(dt);
 if(n!==null&&n<0)return 'expired';
 if(n!==null&&n<=90)return 'expiring';
 return 'complete';
}
function supplyStatus(stockQty,need){if(stockQty<need)return 'low';if(need>0&&stockQty<need*1.2)return 'expiring';return 'complete'}
function cartRisk(c){let list=rowsFor(c.id).map(r=>status(r,byCode(r.medication_code)));if(list.includes('low')||list.includes('expired'))return 'low';if(list.includes('expiring'))return 'expiring';if(list.includes('pending'))return 'pending';return 'complete'}
function cartStats(c){let rows=rowsFor(c.id);let verified=rows.filter(r=>r.actual_qty!==null&&r.actual_qty!==undefined).length;let risks=rows.filter(r=>status(r,byCode(r.medication_code))!=='complete'&&status(r,byCode(r.medication_code))!=='pending').length;return {verified,risks,total:meds.length}}
function tag(v){const labels={pending:'Check required',low:'SHORTAGE',expired:'EXPIRED',expiring:'CAUTION',complete:'SAFE'};const cls={pending:'',low:'red',expired:'red',expiring:'amber',complete:'green'};return `<span class="tag ${cls[v]||''}">${labels[v]||v}</span>`}
function setNav(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===current))}
function tab(t){current=t;focusCart='';render()}
function card(label,value,sub){return `<div class="card"><small>${label}</small><strong>${value}</strong><span class="muted">${sub}</span></div>`}
function render(){setNav();const v=document.getElementById('view');if(current==='pmfh'){v.innerHTML='<div class="empty"><h2>Prince Mohammed Hospital</h2><p>Reserved for future cart and department registration.</p></div>';return}if(focusCart){renderCart();return}if(current==='carts'){renderCarts();return}renderOverview()}
function renderOverview(){const checked=carts.filter(c=>rowsFor(c.id).every(r=>!!r.verified_at)).length;const cnt=stock.filter(r=>r.verified_at).length;let unresolved=stock.filter(r=>status(r,byCode(r.medication_code))!=='complete').length;let unique=meds.filter(m=>{let demand=stock.filter(s=>s.medication_code===m.code&&s.actual_qty!==null).reduce((a,r)=>a+Math.max(0,m.required-Number(r.actual_qty)),0);return demand>(Number(m.lc||0)+Number(m.mosool||0))}).length;document.getElementById('view').innerHTML=`<div class="cards">${card('Qatif crash carts',31,'19 departments')}${card('Verified carts',checked+' / 31','Nursing verification complete')}${card('Items entered',cnt+' / '+(31*meds.length),'Verified by nursing staff')}${card('Recorded issues',unresolved,'Including reference templates')}</div><div class="panel"><div class="sectionhead"><h2>Medication availability</h2><div class="muted">27 Oct 2026 · LC / Mosool snapshot</div></div><div class="toolbar"><input placeholder="Search medication or code" value="${esc(medFilter)}" oninput="medFilter=this.value;renderOverview()"></div><div class="scroll"><table><thead><tr><th>Medication</th><th>Required per cart</th><th>31 carts · standard</th><th>Reference / entered Qty</th><th>Estimated gap</th><th>LC</th><th>Mosool</th><th>Supply</th></tr></thead><tbody>${meds.filter(m=>(m.name+' '+m.code+' '+m.strength).toLowerCase().includes(medFilter.toLowerCase())).map(m=>{let rs=stock.filter(x=>x.medication_code===m.code);let entered=rs.filter(x=>x.actual_qty!==null);let actual=entered.reduce((a,x)=>a+Number(x.actual_qty),0);let gap=entered.reduce((a,x)=>a+Math.max(0,m.required-Number(x.actual_qty)),0);return `<tr><td><b>${esc(m.name)}</b><small>${esc(m.strength)} · ${esc(m.code)}</small></td><td>${number(m.required)}</td><td>${number(m.required*31)}</td><td>${number(actual)} <small>${rs.filter(x=>x.verified_at).length}/31 nursing verified</small></td><td><b class="${gap?'num':''}">${number(gap)}</b></td><td>${number(m.lc)}</td><td>${number(m.mosool)}</td><td>${tag(supplyStatus(Number(m.lc||0)+Number(m.mosool||0),m.required*31))}</td></tr>`}).join('')}</tbody></table></div></div>`}
function renderCarts(){let filtered=carts.filter(c=>(deptFilter==='All'||c.department===deptFilter)&&((c.department+' '+c.label+' '+c.id).toLowerCase().includes(search.toLowerCase())));document.getElementById('view').innerHTML=`<div class="warning">Reference data have been prefilled for all 31 carts. Only the original five ER carts have historical source entries; other departments must confirm their physical quantities and expiry dates.</div><div class="panel"><div class="sectionhead"><h2>Qatif · Department carts</h2><span class="pill">31 carts · 19 departments</span></div><div class="toolbar"><input placeholder="Search department or cart" value="${esc(search)}" oninput="search=this.value;renderCarts()"><select onchange="deptFilter=this.value;renderCarts()"><option>All</option>${[...new Set(carts.map(c=>c.department))].map(x=>`<option ${deptFilter===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="cartgrid">${filtered.map(c=>{let s=cartStats(c);return `<button class="cart" onclick="focusCart='${c.id}';render()"><div class="ctitle">${esc(c.label)}</div><div class="muted" style="font-size:11px;margin-bottom:13px">${c.id}</div><div class="bar"><div class="fill ${s.risks?'red':''}" style="width:${100*s.verified/s.total}%"></div></div><div class="sectionhead"><small>${rowsFor(c.id).filter(r=>r.verified_at).length}/${s.total} verified</small>${tag(cartRisk(c))}</div></button>`}).join('')}</div></div>`}
function allowed(c){return !!(user&&profile&&(profile.role==='admin'||profile.department_id===c.id.replace(/-\d+$/,'')))}
function renderCart(){let c=byCart(focusCart);if(!c)return;let edit=allowed(c);let s=cartStats(c);document.getElementById('view').innerHTML=`<div class="sectionhead"><button class="btn secondary" onclick="focusCart='';current='carts';render()">← All carts</button><span class="pill">${esc(c.id)}</span></div><div class="panel"><div class="sectionhead"><div><h2>${esc(c.label)}</h2><p class="muted">${rowsFor(c.id).filter(r=>r.verified_at).length}/${s.total} verified · ${s.risks} exceptions</p></div><div class="action">${edit?'<button class="btn" onclick="saveCart()">Save changes</button>':'<span class="pill">Read only · assigned nursing account required</span>'}</div></div><div class="scroll"><table><thead><tr><th>Medication</th><th>Required</th><th>Actual</th><th>Expiry date</th><th>Status</th><th>LC</th><th>Mosool</th></tr></thead><tbody>${rowsFor(c.id).map(r=>{let m=byCode(r.medication_code);let val=r.actual_qty===null?'':r.actual_qty;let date=r.expiry_date?.includes('/')?convertMonth(r.expiry_date):r.expiry_date;return `<tr data-med="${esc(m.code)}"><td><b>${esc(m.name)}</b><small>${esc(m.strength)} · ${r.template_only?'Reference template · verify':'ER historical · verify'}</small></td><td>${number(m.required)}</td><td><input class="field inputnum" type="number" min="0" step="1" value="${esc(val)}" ${edit?'':'disabled'} data-field="qty" placeholder="—"></td><td><input class="field dateinput" type="date" value="${esc(date||'')}" ${edit?'':'disabled'} data-field="expiry"></td><td>${tag(status(r,m))}</td><td>${number(m.lc)}</td><td>${number(m.mosool)}</td></tr>`}).join('')}</tbody></table></div><p class="muted">Reference quantities and expiry dates are prefilled from ER for planning only. They are NOT confirmed stock in other departments. Nursing must physically check and save each cart. Zero means absent; blank expiry means not confirmed.</p><div id="saveMsg"></div></div>`}
function convertMonth(v){let x=v.match(/^(\d{1,2})\/(\d{4})$/);if(!x)return '';let y=Number(x[2]),m=Number(x[1]);return `${y}-${String(m).padStart(2,'0')}-${new Date(y,m,0).getDate()}`}
async function login(){if(!SB)return alert('Supabase is not configured yet.');let email=prompt('Staff email address');if(!email)return;let password=prompt('Password');if(!password)return;let {error}=await SB.auth.signInWithPassword({email,password});if(error)return alert(error.message);await fetchLive()}
async function logout(){if(SB)await SB.auth.signOut();user=profile=null;seedPreview();updateAuth();render()}
function updateAuth(){document.getElementById('loginbtn').classList.toggle('hidden',!!user);document.getElementById('logoutbtn').classList.toggle('hidden',!user)}
async function fetchLive(){if(!SB)return;let u=await SB.auth.getUser();user=u.data.user;if(!user){document.getElementById('connection').textContent='Sign in to view live data';updateAuth();return}let pr=await SB.from('staff_access').select('*').eq('user_id',user.id).maybeSingle();profile=pr.data;if(pr.error||!profile){document.getElementById('connection').textContent='Account not assigned';updateAuth();return}let [a,b,c]=await Promise.all([SB.from('carts').select('id,display_name,ordinal,department_id,departments(name,hospital)'),SB.from('medications').select('*'),SB.from('cart_stock').select('*')]);if(a.error||b.error||c.error){alert('Database read failed: '+(a.error||b.error||c.error).message);return}carts=a.data.map(x=>({id:x.id,label:x.display_name,ordinal:x.ordinal,department:x.departments?.name||'',hospital:x.departments?.hospital||''}));meds=b.data.map(x=>({code:x.code,name:x.name,strength:x.strength,required:Number(x.required_qty),lc:Number(x.lc_qty||0),mosool:Number(x.mosool_qty||0)}));stock=c.data;document.getElementById('connection').textContent='● Connected · '+profile.display_name;updateAuth();render()}
async function saveCart(){let c=byCart(focusCart);if(!SB||!allowed(c))return;let changes=[];for(const tr of document.querySelectorAll('tr[data-med]')){let code=tr.dataset.med, q=tr.querySelector('[data-field=qty]').value, dt=tr.querySelector('[data-field=expiry]').value;let num=q===''?null:Number(q);if(num!==null&&(!Number.isInteger(num)||num<0))return alert('Enter a non-negative whole number for quantities.');if(num>0&&!dt)return alert('Please enter expiry for '+byCode(code).name);changes.push({cart_id:c.id,medication_code:code,actual_qty:num,expiry_date:dt||null,verified_at:num===null?null:new Date().toISOString()})}const save=document.querySelector('#saveMsg');save.textContent='Saving…';for(const r of changes){const {error}=await SB.from('cart_stock').update({actual_qty:r.actual_qty,expiry_date:r.expiry_date,verified_at:r.verified_at}).eq('cart_id',r.cart_id).eq('medication_code',r.medication_code);if(error){save.textContent='Failed: '+error.message;return}}save.textContent='Saved';await fetchLive()}
render();if(SB)fetchLive();
